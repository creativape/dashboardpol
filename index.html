<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#111827;font-size:14px}

<body>

<!-- TODO TU HTML ORIGINAL (NO SE MODIFICA) -->
<!-- (topbar, nav, cards, etc. todo igual que tu archivo) -->

<!-- IMPORTANTE: SOLO CAMBIA EL SCRIPT -->

<script>

/* ================= BASE ================= */
var NOTICIAS_BASE = [
  {t:"Sistema listo",f:"Demo",h:"ahora",s:"neu",r:"Esperando datos reales",tags:["Sistema"],nuevo:true}
];

var currentFilter = 'todos';

/* ================= RENDER ================= */
function renderNews(){
  var list=currentFilter==='todos'?NOTICIAS_BASE:NOTICIAS_BASE.filter(function(n){
    return(currentFilter==='neg'&&n.s==='neg')||(currentFilter==='pos'&&n.s==='pos')||(currentFilter==='neu'&&n.s==='neu');
  });

  var el=document.getElementById('news-list');
  if(!el)return;

  el.innerHTML=list.map(function(n){
    var bc=n.s==='neg'?'bneg':n.s==='pos'?'bpos':'bneu';
    var tc=n.s==='neg'?'tr':n.s==='pos'?'tg':'tn';
    var tl=n.s==='neg'?'Negativo':n.s==='pos'?'Positivo':'Neutro';
    var newBadge=n.nuevo?'<span class="ni-new">NUEVO</span>':'';

    return `
    <div class="ni">
      <div class="ni-bar ${bc}"></div>
      <div style="flex:1">
        <div class="ni-t">${n.t}${newBadge}</div>
        <div class="ni-m">${n.f} · ${n.h}</div>
        <div class="ni-b">${n.r}</div>
        <div class="ni-tags">
          <span class="tag ${tc}">${tl}</span>
          ${n.tags.map(t=>`<span class="tag tn">${t}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ================= DASHBOARD ================= */
function actualizarDashboard(){

  const total = NOTICIAS_BASE.length;

  const pos = NOTICIAS_BASE.filter(n => n.s === "pos").length;
  const neg = NOTICIAS_BASE.filter(n => n.s === "neg").length;
  const neu = NOTICIAS_BASE.filter(n => n.s === "neu").length;

  const pPos = Math.round((pos / total) * 100) || 0;
  const pNeg = Math.round((neg / total) * 100) || 0;
  const pNeu = 100 - pPos - pNeg;

  document.getElementById('sp-txt').textContent = pPos + "% positivo";
  document.getElementById('sn-txt').textContent = pNeu + "% neutral";
  document.getElementById('sg-txt').textContent = pNeg + "% negativo";
}

/* ================= REFRESH (FIX REAL) ================= */
async function refreshAll(){

  const btn = document.getElementById('btn-refresh');
  const dot = document.getElementById('status-dot');

  if(btn.disabled) return;

  btn.disabled = true;
  dot.classList.add('syncing');

  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();

    if(!data || !data.noticias){
      throw new Error("Sin data");
    }

    NOTICIAS_BASE = data.noticias.map(function(n){
      return {
        t: n.t || n,
        f: "Fuente externa",
        h: "ahora",
        s: n.s || "neu",
        r: n.t || n,
        tags: ["Tiempo real"],
        nuevo: true
      };
    });

    renderNews();
    actualizarDashboard();

  } catch (err) {

    console.error(err);

    NOTICIAS_BASE = [{
      t: "Error obteniendo datos reales",
      f: "Sistema",
      h: "ahora",
      s: "neu",
      r: "Revisa API / créditos",
      tags: ["Error"],
      nuevo: true
    }];

    renderNews();
  }

  btn.disabled = false;
  dot.classList.remove('syncing');
}

/* ================= NAV ================= */
function show(id,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('sec-'+id).classList.add('on');
  btn.classList.add('on');
}

/* ================= INIT ================= */
renderNews();
actualizarDashboard();

</script>

</body>
</html>
