<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Monitor Electoral</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
button{padding:8px 15px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer}
.card{background:#fff;padding:15px;margin-top:15px;border-radius:10px}
</style>
</head>
<body>

<h2>🧠 Monitor Electoral</h2>

<button onclick="refreshAll()" id="btn-refresh">Actualizar</button>

<div class="card">
  <h3>📰 Noticias</h3>
  <div id="news-list"></div>
</div>

<div class="card">
  <h3>📊 Sentimiento</h3>
  <p id="sp-txt">0% positivo</p>
  <p id="sn-txt">0% neutral</p>
  <p id="sg-txt">0% negativo</p>
</div>

<script>

// ================= BASE =================
var NOTICIAS_BASE = [
  {t:"Sistema iniciado correctamente", s:"neu"}
];

// ================= RENDER =================
function renderNews(){
  const el = document.getElementById("news-list");

  el.innerHTML = NOTICIAS_BASE.map(n => `
    <div style="margin-bottom:10px;">
      <b>${n.t}</b><br>
      <small>${n.s}</small>
    </div>
  `).join("");
}

// ================= DASHBOARD =================
function actualizarDashboard(){
  const total = NOTICIAS_BASE.length;

  const pos = NOTICIAS_BASE.filter(n => n.s === "pos").length;
  const neg = NOTICIAS_BASE.filter(n => n.s === "neg").length;
  const neu = NOTICIAS_BASE.filter(n => n.s === "neu").length;

  const pPos = Math.round((pos / total) * 100) || 0;
  const pNeg = Math.round((neg / total) * 100) || 0;
  const pNeu = 100 - pPos - pNeg;

  document.getElementById("sp-txt").textContent = pPos + "% positivo";
  document.getElementById("sn-txt").textContent = pNeu + "% neutral";
  document.getElementById("sg-txt").textContent = pNeg + "% negativo";
}

// ================= REFRESH =================
async function refreshAll(){

  const btn = document.getElementById("btn-refresh");
  btn.disabled = true;

  try {

    const res = await fetch("/api/dashboard");
    const data = await res.json();

    if(!data || !data.noticias){
      throw new Error("Sin datos");
    }

    NOTICIAS_BASE = data.noticias.map(n => ({
      t: n.t || n,
      s: n.s || "neu"
    }));

    renderNews();
    actualizarDashboard();

  } catch (err) {

    console.error(err);

    NOTICIAS_BASE = [
      {t:"Error obteniendo datos reales", s:"neu"}
    ];

    renderNews();
    actualizarDashboard();
  }

  btn.disabled = false;
}

// ================= INIT =================
renderNews();
actualizarDashboard();

</script>

</body>
</html>
