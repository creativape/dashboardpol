<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor Electoral — López Aliaga 2026</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#111827;font-size:14px}

/* TOPBAR */
.topbar{background:#1a1a2e;color:white;padding:11px 20px;display:flex;justify-content:space-between}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.dot.syncing{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.2}}

/* NAV */
.nav{background:white;border-bottom:1px solid #ddd;display:flex}
.nb{padding:10px 15px;border:none;background:none;cursor:pointer}
.nb.on{border-bottom:2px solid #2563eb;font-weight:bold}

/* CONTENT */
.cnt{padding:20px}
.sec{display:none}
.sec.on{display:block}

/* CARDS */
.card{background:white;padding:15px;border-radius:10px;margin-bottom:15px}

/* NEWS */
.ni{border-bottom:1px solid #eee;padding:10px 0}
.ni:last-child{border:none}
.ni-t{font-weight:bold}

/* BUTTON */
.btn-refresh{background:#2563eb;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
</style>
</head>

<body>

<div class="topbar">
  <div>Monitor Electoral</div>
  <div class="dot" id="status-dot"></div>
</div>

<div class="nav">
  <button class="nb on" onclick="show('noticias',this)">Noticias</button>
  <button class="nb" onclick="show('sentimiento',this)">Sentimiento</button>
</div>

<div class="cnt">

<div class="sec on" id="sec-noticias">
  <button class="btn-refresh" id="btn-refresh" onclick="refreshAll()">Actualizar</button>
  <div id="news-list"></div>
</div>

<div class="sec" id="sec-sentimiento">
  <div class="card">
    <p id="sp-txt">0% positivo</p>
    <p id="sn-txt">0% neutral</p>
    <p id="sg-txt">0% negativo</p>
  </div>
</div>

</div>

<script>

/* ================= BASE ================= */
var NOTICIAS_BASE = [
  {t:"Sistema listo",s:"neu"}
];

/* ================= RENDER ================= */
function renderNews(){
  var el=document.getElementById('news-list');
  el.innerHTML = NOTICIAS_BASE.map(n=>`
    <div class="ni">
      <div class="ni-t">${n.t}</div>
      <div>${n.s}</div>
    </div>
  `).join('');
}

/* ================= DASHBOARD ================= */
function actualizarDashboard(){
  const total = NOTICIAS_BASE.length;

  const pos = NOTICIAS_BASE.filter(n=>n.s==="pos").length;
  const neg = NOTICIAS_BASE.filter(n=>n.s==="neg").length;
  const neu = NOTICIAS_BASE.filter(n=>n.s==="neu").length;

  const pPos = Math.round((pos/total)*100)||0;
  const pNeg = Math.round((neg/total)*100)||0;
  const pNeu = 100 - pPos - pNeg;

  document.getElementById('sp-txt').textContent = pPos+"% positivo";
  document.getElementById('sn-txt').textContent = pNeu+"% neutral";
  document.getElementById('sg-txt').textContent = pNeg+"% negativo";
}

/* ================= REFRESH ================= */
async function refreshAll(){

  const btn = document.getElementById('btn-refresh');
  const dot = document.getElementById('status-dot');

  if(btn.disabled) return;

  btn.disabled = true;
  dot.classList.add('syncing');

  try {
    const res = await fetch('/api/dashboard');
    const data = await res.json();

    if(!data || !data.noticias){
      throw new Error("Sin data");
    }

    NOTICIAS_BASE = data.noticias.map(n=>({
      t: n.t || n,
      s: n.s || "neu"
    }));

    renderNews();
    actualizarDashboard();

  } catch (err) {

    console.error(err);

    NOTICIAS_BASE = [{
      t:"Error obteniendo datos reales",
      s:"neu"
    }];

    renderNews();
    actualizarDashboard();
  }

  btn.disabled = false;
  dot.classList.remove('syncing');
}

/* ================= NAV ================= */
function show(id,btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('sec-'+id).classList.add('on');
  btn.classList.add('on');
}

/* ================= INIT ================= */
renderNews();
actualizarDashboard();

</script>

</body>
</html>
